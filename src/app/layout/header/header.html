<div class="header container">
  <a routerLink="/" class="brand" (click)="menuOpen.set(false)" aria-label="Inicio">
    <app-monogram class="brand__logo" [name]="profile().name" />
    <span class="brand__text">
      <strong>{{ shortName() }}</strong>
      <span>{{ profile().role }}</span>
    </span>
  </a>

  <nav id="main-nav" class="nav" [class.nav--open]="menuOpen()" aria-label="Principal">
    <ul>
      @for (item of nav; track item.fragment) {
        <li>
          <a routerLink="/" [fragment]="item.fragment" (click)="menuOpen.set(false)">{{
            item.label
          }}</a>
        </li>
      }
      <li>
        <a routerLink="/cv" routerLinkActive="active" (click)="menuOpen.set(false)">CV</a>
      </li>
    </ul>
  </nav>

  <div class="actions">
    <button
      type="button"
      class="icon-btn"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.theme() === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'"
    >
      <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" [size]="16" />
    </button>
    <a class="btn btn--primary btn--sm cta" routerLink="/" fragment="contacto">Contactar</a>
    <button
      type="button"
      class="icon-btn menu-toggle"
      aria-controls="main-nav"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="menuOpen.update((open) => !open)"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="18" />
    </button>
  </div>
</div>
